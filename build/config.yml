version: '3'

info:
  companyName: Milo
  productName: Milo
  productIdentifier: io.github.pavlith.milo
  description: A lightweight, Linux-first email client
  version: 0.0.1

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin]
    file: ['*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: make build-dev
      type: blocking
    - cmd: npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 --strictPort
      type: background
      readiness:
        http: http://127.0.0.1:5173/
        timeout: 60s
    - cmd: ./build/bin/milo-dev
      type: primary
      exit_policy: shutdown
