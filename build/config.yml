version: '3'

info:
  companyName: Aerion
  productName: Aerion
  productIdentifier: io.github.hkdb.Aerion
  description: A modern email client
  version: 0.3.6

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin]
    file: ['*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: make build-dev
      type: blocking
    - cmd: npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 --strictPort
      type: background
      readiness:
        http: http://127.0.0.1:5173/
        timeout: 60s
    - cmd: ./build/bin/aerion-dev
      type: primary
      exit_policy: shutdown
