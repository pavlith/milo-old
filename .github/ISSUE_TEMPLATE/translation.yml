name: Translation Contribution
description: Suggest an English or Russian UI translation update
title: "Contribution | Translation: "
labels: ["contribution", "translate"]
body:
  - type: markdown
    attributes:
      value: |
        Please review the [translation guide](https://github.com/pavlith/milo/blob/dev/docs/LANGUAGE.md) and search [existing translation issues](https://github.com/pavlith/milo/issues?q=label%3Atranslate).
  - type: dropdown
    id: language
    attributes:
      label: UI language
      options:
        - English (en)
        - Русский (ru)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Proposed update
      description: Include the affected screen, current wording, and proposed change.
    validations:
      required: true
