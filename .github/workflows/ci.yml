name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  linux:
    name: Linux (GTK4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install GTK and WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build the Linux application
        run: |
          make build
          test -x build/bin/milo
      - name: Check generated bindings
        run: |
          git diff --exit-code -- frontend/bindings
          untracked=$(git ls-files --others --exclude-standard -- frontend/bindings)
          if [ -n "$untracked" ]; then
            printf 'Untracked bindings:\n%s\n' "$untracked"
            exit 1
          fi
      - name: Check and lint frontend
        run: npm run check && npm run lint
        working-directory: frontend
      - name: Test and vet Go
        run: go test ./... && go vet ./...
